version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: btc-heatmap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: btc-heatmap-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BINANCE_WS_URL=wss://stream.binance.com:9443/ws
      - SYMBOL=BTCUSDT
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: btc-heatmap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
