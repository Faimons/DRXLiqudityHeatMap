steps:
  # Build Backend Image for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/btc-heatmap-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/btc-heatmap-backend:latest'
      - '-f'
      - 'docker/Dockerfile.backend-cloudrun'
      - '.'
    id: 'build-backend'

  # Build Frontend Image for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/btc-heatmap-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/btc-heatmap-frontend:latest'
      - '-f'
      - 'docker/Dockerfile.frontend-cloudrun'
      - '--build-arg'
      - 'VITE_API_URL=/api'
      - '--build-arg'
      - 'VITE_WS_URL=/ws'
      - '.'
    id: 'build-frontend'
    waitFor: ['-']

  # Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/btc-heatmap-backend:$SHORT_SHA']
    id: 'push-backend'
    waitFor: ['build-backend']

  # Push Backend Latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/btc-heatmap-backend:latest']
    waitFor: ['build-backend']

  # Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/btc-heatmap-frontend:$SHORT_SHA']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Push Frontend Latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/btc-heatmap-frontend:latest']
    waitFor: ['build-frontend']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'btc-heatmap-backend'
      - '--image=gcr.io/$PROJECT_ID/btc-heatmap-backend:$SHORT_SHA'
      - '--region=${_CLOUD_RUN_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--set-env-vars=REDIS_HOST=${_REDIS_HOST},REDIS_PORT=6379,BINANCE_WS_URL=wss://stream.binance.com:9443/ws,SYMBOL=BTCUSDT,LOG_LEVEL=INFO'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'btc-heatmap-frontend'
      - '--image=gcr.io/$PROJECT_ID/btc-heatmap-frontend:$SHORT_SHA'
      - '--region=${_CLOUD_RUN_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=5'
    id: 'deploy-frontend'
    waitFor: ['push-frontend', 'deploy-backend']

substitutions:
  _CLOUD_RUN_REGION: 'us-central1'
  _REDIS_HOST: 'localhost'  # Update with Redis connection after setup

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/btc-heatmap-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/btc-heatmap-backend:latest'
  - 'gcr.io/$PROJECT_ID/btc-heatmap-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/btc-heatmap-frontend:latest'
